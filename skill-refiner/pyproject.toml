[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skill-refiner"
version = "0.1.0"
description = "ADK Graph harness and deterministic control kernel for creating and refining Agent Skills"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "google-adk>=2.13,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
host = ["cursor-sdk>=1.2,<2"]

[project.scripts]
skill-refiner = "skill_refiner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_refiner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

